	<body>
		<div class="estrelas" aria-hidden="true"></div>

		<div class="salao">
			<header class="marquise">
				<div class="lampadas" aria-hidden="true"></div>
				<p class="marquise-topo">CEDERJ · CALCULADORA DE NOTAS</p>
				<h1 class="neon">VOU PASSAR<span class="piscando">?</span></h1>
			</header>

			<main class="crt" id="crt">
				<div class="crt-conteudo">
					<p class="insira">INSIRA SUAS NOTAS</p>

					<nav class="selecao" aria-label="Curso">
						<p class="rotulo-pixel">Selecione o curso</p>
						<div class="jogadores">
							<a href="/" class="jogador pixel" aria-current="page"><span class="p">P1</span> Computação</a>
							<a href="/biblioteconomia.html" class="jogador pixel"><span class="p">P2</span> Biblioteconomia</a>
						</div>
					</nav>

					<nav class="fases" aria-label="Calculadoras">
						<a href="/" class="fase">FASE 1 · AP2</a>
						<a href="/ap3.html" class="fase" aria-current="page">FASE 2 · AP3</a>
					</nav>

					<h2>Quanto preciso tirar na AP3?</h2>
					<p class="missao">Última chance! Missão: fechar <strong>média final 5</strong>. Use N1 e N2 como aparecem no SCA.</p>

					<form id="ap3Form" novalidate>
						<div class="campos">
					<div class="campo">
						<label for="n1">N1</label>
						<input type="text" id="n1" name="n1" placeholder="4,0" inputmode="decimal" autocomplete="off" maxlength="5" />
					</div>
					<div class="campo">
						<label for="n2">N2</label>
						<input type="text" id="n2" name="n2" placeholder="3,5" inputmode="decimal" autocomplete="off" maxlength="5" />
					</div>
						</div>

						<button type="submit" class="botao">CALCULAR AP3</button>
					</form>

					<section id="result" class="hud pixel" role="status" aria-live="polite" hidden>
						<p class="hud-status"></p>
						<div class="hud-placar" aria-hidden="true">
							<span class="hud-rotulo"></span>
							<span class="hud-numero"></span>
						</div>
						<div class="hud-energia" aria-hidden="true">
							<div class="barra"></div>
							<div class="barra-escala"><span>0</span><span>5</span><span>10</span></div>
						</div>
						<p class="hud-detalhe"></p>
						<a class="hud-acao" href="/ap3.html" hidden></a>
					</section>
				</div>
			</main>

			<footer class="creditos pixel">
				<p class="creditos-titulo">CRÉDITOS</p>
